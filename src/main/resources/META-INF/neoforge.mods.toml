license = "CC0-1.0"

modLoader="javafml"
loaderVersion="[1,)"

[[mods]]
modId = "${id}"
displayName = "${name}"
version = "${version}"
authors = "ReverendBrown with Claude AI"
description = "Edit real Excel workbooks inside Minecraft."

# A held shared workbook looks like a window (see the mixin package).
[[mixins]]
config = "excelcomputer.mixins.json"

[[dependencies.${id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft}"
ordering = "NONE"
side = "BOTH"
